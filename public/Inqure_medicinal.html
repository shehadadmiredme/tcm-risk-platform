<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="herb.title">药材查询 — 常用中药偏方风险信息公开平台</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='80'%3E🌿%3C/text%3E%3C/svg%3E">

    <!-- CDN: RemixIcon 图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">

    <!-- 项目样式 -->
    <link rel="stylesheet" href="CSS/Inqure_medicinal.css">
    <!-- 共享动效样式 -->
    <link rel="stylesheet" href="CSS/animations.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="nav">
        <div class="nav-brand">
            <a href="./index.html" aria-label="返回首页">
                <img src="./5717be68dae7df9f5529512d17a4ed3c.jpg" data-i18n-alt="nav.logoAlt" alt="留神">
            </a>
            <h1 class="h1-1" data-i18n="nav.brand">常用中药偏方风险信息公开平台</h1>
        </div>
        <div class="nav-links">
            <a href="./index.html" id="menu" data-i18n="nav.home">
                <i class="ri-home-4-line"></i> 首页
            </a>
            <details id="insert">
                <summary data-i18n="nav.query"><i class="ri-search-line"></i> 查询</summary>
                <div class="dropdown-menu">
                    <a href="./Inqure_prescription.html"><i class="ri-file-list-3-line"></i> <span data-i18n="nav.prescriptionQuery">药方查询</span></a>
                    <a href="./Inqure_medicinal.html" style="color:var(--color-primary);font-weight:700;">
                        <i class="ri-plant-line"></i> <span data-i18n="nav.herbQuery">药材查询</span>
                    </a>
                </div>
            </details>
            <a href="./Graph_visualization.html"><i class="ri-git-branch-line"></i> <span data-i18n="nav.graph">图谱可视化</span></a>
            <a href="./Disclaimer.html" id="declara"><i class="ri-shield-check-line"></i> <span data-i18n="nav.aboutAndDisclaimer">关于平台及免责声明</span></a>
        </div>
    </nav>

    <!-- 分隔线 -->
    <hr class="nav-divider">

    <!-- 搜索框 -->
    <div class="search" data-reveal>
        <i class="ri-search-line" style="color:#aaa;font-size:18px;margin-right:4px;"></i>
        <input type="text" id="searchInput" data-i18n-placeholder="herb.searchPlaceholder" placeholder="请输入药材名称，如：板蓝根、菊花、枸杞...">
        <span id="searchBtn" data-i18n="herb.searchBtn"><i class="ri-search-line"></i> 搜索</span>
    </div>

    <!-- 药品标题 -->
    <div class="title" data-reveal>
        <div><i class="ri-plant-line"></i> <span id="herbName" data-i18n="herb.nameLabel">药品名称</span></div>
        <div><span id="herbAlias">别名/常用名：—</span></div>
    </div>

    <!-- 四宫格展示区 -->
    <div class="show card-rise-stagger">
        <div class="imagine" data-tilt>
            <h2><i class="ri-information-line"></i> <span data-i18n="herb.section.basicInfo">基础信息</span></h2>
            <div class="result-content" id="card-basic"><p style="color:var(--text-tertiary);margin-top:8px;">此处展示药材的来源、性味归经、功效主治等基础信息。</p></div>
        </div>
        <div class="unhealth" data-tilt>
            <h2><i class="ri-alert-line"></i> <span data-i18n="herb.section.adverseEffects">可能出现的不良症状</span></h2>
            <div class="result-content" id="card-risk"><p style="color:var(--text-tertiary);margin-top:8px;">此处展示该药材已知的不良反应和毒副作用信息。</p></div>
        </div>
        <div class="popularity" data-tilt>
            <h2><i class="ri-user-heart-line"></i> <span data-i18n="herb.section.riskGroup">易感人群/注意事项</span></h2>
            <div class="result-content" id="card-note"><p style="color:var(--text-tertiary);margin-top:8px;">此处展示禁忌人群、使用注意事项和药物相互作用。</p></div>
        </div>
        <div class="symptoms" data-tilt>
            <h2><i class="ri-stethoscope-line"></i> <span data-i18n="herb.section.indications">常用于什么症状</span></h2>
            <div class="result-content" id="card-symptom"><p style="color:var(--text-tertiary);margin-top:8px;">此处展示该药材的常见适应症和临床应用场景。</p></div>
        </div>
    </div>

    <!-- 温馨提示 -->
    <div class="notice" data-reveal>
        <div style="font-size:22px;">⚠️</div>
        <div>
            <b data-i18n="common.notice.title">温馨提示</b>
            <span data-i18n="common.notice.content">平台内容来源于公开文献、药典、药监信息与古籍记载，仅用于风险信息公开与科普展示；所有结论应以医生、药师及官方最新公告为准。</span>
        </div>
    </div>

    <!-- i18n 国际化系统 -->
    <script src="JS/i18n.js"></script>
    <script src="JS/zh-CN.js"></script>
    <!-- 全局动效引擎 -->
    <script src="JS/effects.js"></script>
    <!-- API 通信 + 查询逻辑 -->
    <script src="JS/api.js"></script>
    <script src="JS/Inqure_medicinal.js"></script>
    <script>
    if (typeof I18N !== 'undefined') {
        I18N.autoInit();
    }
    </script>
</body>
</html>
